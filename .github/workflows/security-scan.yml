  push:
    branches: [master]
permissions:
  contents: read
jobs:
  security:
    uses: davidvaquerizo-leadtech/security-pipeline/.github/workflows/scan.yml@e2423d35b2318ea6c9591a8a4752ac6de10b9297 # release 2026-09-23
    with:
      image: ghcr.io/davidvaquerizo-leadtech/security-pipeline@sha256:c20595bc2e72631b08de8188bdabda122e5583832d35a709d9d491c905bd5757
